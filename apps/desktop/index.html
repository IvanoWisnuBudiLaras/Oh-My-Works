<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oh My Works</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --sidebar: #181818;
      --panel: #252526;
      --panel-hover: #2a2d2e;
      --panel-active: #37373d;
      --border: #2e3138;
      --border-focus: #007acc;
      --text: #cccccc;
      --text-bright: #ffffff;
      --text-muted: #858585;
      --accent: #007acc;
      --accent-hover: #1f8ad2;
      --green: #4ec9b0;
      --amber: #cca700;
      --red: #f14c4c;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Sidebar (VS Code activity / file tree style) */
    .sidebar {
      width: 240px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .btn-new {
      margin: 8px 10px;
      padding: 6px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-new:hover { background: var(--panel-hover); border-color: var(--border-focus); }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .history-item {
      padding: 6px 8px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 2px solid transparent;
    }

    .history-item:hover { background: var(--panel-hover); }
    .history-item.active { background: var(--panel-active); border-left-color: var(--accent); color: var(--text-bright); }

    .sidebar-footer {
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* Main Container */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .topbar {
      height: 38px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-selector-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
    }

    .model-selector-btn:hover { border-color: var(--border-focus); }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--green);
    }

    /* Workspace Body (Single by default, AI controls Split) */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Chat Pane */
    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 380px;
      position: relative;
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 120px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .msg-author {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .msg-author.ai { color: var(--accent); }

    .msg-content {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-bright);
      word-break: break-word;
    }

    .msg-user .msg-content {
      background: var(--panel);
      padding: 8px 12px;
      border: 1px solid var(--border);
    }

    /* AI Side Canvas (Opened dynamically by AI) */
    .side-canvas {
      width: 0;
      border-left: 0 solid var(--border);
      background: #141414;
      display: flex;
      flex-direction: column;
      transition: width 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .side-canvas.open {
      width: 460px;
      border-left: 1px solid var(--border);
    }

    .canvas-header {
      height: 34px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .canvas-tabs {
      display: flex;
      gap: 2px;
    }

    .canvas-tab {
      padding: 4px 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .canvas-tab.active {
      background: var(--bg);
      color: var(--text-bright);
      border-top: 2px solid var(--accent);
    }

    .canvas-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: #d4d4d4;
      background: #1e1e1e;
    }

    .btn-close-canvas {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .btn-close-canvas:hover { color: var(--text-bright); }

    /* Bottom Prompt Area */
    .prompt-container {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 860px;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 6px 10px;
      gap: 4px;
    }

    .prompt-container:focus-within { border-color: var(--border-focus); }

    .prompt-textarea {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-bright);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.4;
      resize: none;
      min-height: 36px;
      max-height: 140px;
    }

    .prompt-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chips-group {
      display: flex;
      gap: 4px;
    }

    .chip-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .chip-btn:hover, .chip-btn.active { color: var(--text-bright); border-color: var(--accent); }

    .btn-submit {
      background: var(--accent);
      border: none;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      cursor: pointer;
    }

    .btn-submit:hover { background: var(--accent-hover); }

    /* Model Selection Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 200;
      display: none;
      place-items: center;
    }

    .modal-overlay.show { display: grid; }

    .modal-box {
      width: 580px;
      max-width: calc(100vw - 32px);
      max-height: 75vh;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .modal-search {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .modal-input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
    }

    .modal-input:focus { border-color: var(--border-focus); }

    .modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .modal-item {
      padding: 6px 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-item:hover { background: var(--panel-hover); color: #fff; }
    .modal-item.active { background: var(--panel-active); color: var(--accent); }

    .code-block {
      background: #141414;
      border: 1px solid var(--border);
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-x: auto;
      margin: 6px 0;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span>Explorer / Sessions</span>
    </div>
    <button type="button" class="btn-new" id="btnNewSession">+ New Thread</button>
    <div class="history-list" id="historyList"></div>
    <div class="sidebar-footer">
      <div>PSI: <span style="color:var(--green)">0.00% SAFE</span></div>
      <div>RAM: 5,901 MB Free (46%)</div>
    </div>
  </aside>

  <!-- Main Viewport -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="model-selector-btn" id="btnModelPicker">
          Model: <span id="currentModelLabel">ag/gemini-4-argon-high</span>
        </button>
        <span class="status-badge" id="routerStatus">• 9Router :20128 (65 Models)</span>
      </div>
      <div>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);" id="sideCanvasStatus">Single View</span>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace" id="workspaceContainer">
      <!-- Chat Pane -->
      <section class="chat-pane" id="chatPane">
        <div class="messages-scroll" id="messagesScroll">
          <div id="messagesList"></div>
        </div>

        <!-- Prompt Bar -->
        <div class="prompt-container">
          <textarea id="promptInput" class="prompt-textarea" placeholder="Type prompt or command..."></textarea>
          <div class="prompt-footer">
            <div class="chips-group">
              <button type="button" class="chip-btn active" data-agent="@all">@all</button>
              <button type="button" class="chip-btn" data-agent="@terminal">@terminal</button>
              <button type="button" class="chip-btn" data-agent="@guardian">@guardian</button>
            </div>
            <button type="button" class="btn-submit" id="btnSubmit">Send</button>
          </div>
        </div>
      </section>

      <!-- AI-Controlled Side Canvas -->
      <section class="side-canvas" id="sideCanvas">
        <div class="canvas-header">
          <div class="canvas-tabs">
            <button type="button" class="canvas-tab active" id="tabTitle">Output / Artifact</button>
          </div>
          <button type="button" class="btn-close-canvas" id="btnCloseCanvas">[Close]</button>
        </div>
        <div class="canvas-body" id="canvasContent">
          <!-- Populated by AI actions -->
        </div>
      </section>
    </div>
  </main>

  <!-- Searchable Model Selector Modal -->
  <div class="modal-overlay" id="modelModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Select Model Engine</span>
        <button type="button" class="btn-close-canvas" id="btnHideModal">[Esc]</button>
      </div>
      <div class="modal-search">
        <input type="text" class="modal-input" id="modelSearchInput" placeholder="Filter models (gemini, claude, deepseek, qwen, kimi, glm)..." />
      </div>
      <div class="modal-list" id="modalModelList"></div>
    </div>
  </div>

  <script>
    (function () {
      const ROUTER_URL = 'http://127.0.0.1:20128/v1/chat/completions';
      const ROUTER_KEY = 'Bearer sk-9d6e79acb260096f-53jdmp-b86fbd6e';

      let activeModel = 'ag/gemini-4-argon-high';
      let allModels = [
        "ag/gemini-4-argon-high", "ag/gemini-3.8-flash-high", "ag/claude-opus-5-5-high",
        "cbcn/deepseek-v4-pro", "cbcn/deepseek-v4.1-flash", "cbcn/glm-5.3", "cbcn/glm-5.2",
        "ivano/gpt-5.6-luna", "ivano/gpt-5.6-sol", "ivano/claude-sonnet-4.5", "ivano/claude-haiku-4.5",
        "ivano/gemini-3.7-flash", "ivano/deepseek-v4-pro", "ivano/qwen-3.8-max", "ivano/kimi-k3",
        "auto", "paid", "Haltech"
      ];

      let sessions = [
        { id: 'sess-1', title: 'Workspace Init & Kernel PSI', messages: [] }
      ];
      let activeSessionId = 'sess-1';

      // Elements
      const historyList = document.getElementById('historyList');
      const messagesList = document.getElementById('messagesList');
      const messagesScroll = document.getElementById('messagesScroll');
      const promptInput = document.getElementById('promptInput');
      const btnSubmit = document.getElementById('btnSubmit');
      const sideCanvas = document.getElementById('sideCanvas');
      const canvasContent = document.getElementById('canvasContent');
      const tabTitle = document.getElementById('tabTitle');
      const btnCloseCanvas = document.getElementById('btnCloseCanvas');
      const sideCanvasStatus = document.getElementById('sideCanvasStatus');

      // AI Split Canvas Control
      // ponytail: AI opens side canvas when code/tool/execution output exists. Upgrade when streaming parser expands.
      function aiOpenSideCanvas(title, html) {
        tabTitle.textContent = title;
        canvasContent.innerHTML = html;
        sideCanvas.classList.add('open');
        sideCanvasStatus.textContent = 'Split Active: ' + title;
      }

      function aiCloseSideCanvas() {
        sideCanvas.classList.remove('open');
        sideCanvasStatus.textContent = 'Single View';
      }

      btnCloseCanvas.addEventListener('click', aiCloseSideCanvas);

      // Model Selector Modal
      const btnModelPicker = document.getElementById('btnModelPicker');
      const currentModelLabel = document.getElementById('currentModelLabel');
      const modelModal = document.getElementById('modelModal');
      const btnHideModal = document.getElementById('btnHideModal');
      const modelSearchInput = document.getElementById('modelSearchInput');
      const modalModelList = document.getElementById('modalModelList');

      btnModelPicker.addEventListener('click', () => {
        modelSearchInput.value = '';
        renderModalModels(allModels);
        modelModal.classList.add('show');
        modelSearchInput.focus();
      });

      btnHideModal.addEventListener('click', () => modelModal.classList.remove('show'));
      modelModal.addEventListener('click', (e) => {
        if (e.target === modelModal) modelModal.classList.remove('show');
      });

      function renderModalModels(list) {
        modalModelList.innerHTML = '';
        list.forEach(m => {
          const div = document.createElement('div');
          div.className = `modal-item ${m === activeModel ? 'active' : ''}`;
          div.innerHTML = `<span>${escapeHtml(m)}</span><span>${m === activeModel ? '[Active]' : ''}</span>`;
          div.addEventListener('click', () => {
            activeModel = m;
            currentModelLabel.textContent = m;
            modelModal.classList.remove('show');
          });
          modalModelList.appendChild(div);
        });
      }

      modelSearchInput.addEventListener('input', () => {
        const q = modelSearchInput.value.toLowerCase().trim();
        renderModalModels(allModels.filter(m => m.toLowerCase().includes(q)));
      });

      // Sessions
      function renderSessions() {
        historyList.innerHTML = '';
        sessions.forEach(s => {
          const item = document.createElement('div');
          item.className = `history-item ${s.id === activeSessionId ? 'active' : ''}`;
          item.textContent = s.title;
          item.addEventListener('click', () => {
            activeSessionId = s.id;
            renderSessions();
            renderChat();
          });
          historyList.appendChild(item);
        });
      }

      document.getElementById('btnNewSession').addEventListener('click', () => {
        const id = 'sess-' + Date.now();
        sessions.unshift({ id, title: 'New Thread', messages: [] });
        activeSessionId = id;
        renderSessions();
        renderChat();
        aiCloseSideCanvas();
      });

      // Chat Render
      function renderChat() {
        messagesList.innerHTML = '';
        const cur = sessions.find(s => s.id === activeSessionId);
        if (!cur) return;
        cur.messages.forEach(m => appendMessage(m.role, m.content, m.author));
        messagesScroll.scrollTop = messagesScroll.scrollHeight;
      }

      function appendMessage(role, content, author) {
        const row = document.createElement('div');
        row.className = `msg-row ${role === 'user' ? 'msg-user' : 'msg-ai'}`;

        const auth = document.createElement('div');
        auth.className = `msg-author ${role === 'user' ? 'user' : 'ai'}`;
        auth.textContent = author || (role === 'user' ? 'USER' : activeModel);

        const body = document.createElement('div');
        body.className = 'msg-content';
        body.innerHTML = formatMarkdown(content);

        row.appendChild(auth);
        row.appendChild(body);
        messagesList.appendChild(row);
        messagesScroll.scrollTop = messagesScroll.scrollHeight;
        return body;
      }

      // Prompt Submit & AI Response
      async function handleSend() {
        const text = promptInput.value.trim();
        if (!text) return;
        const cur = sessions.find(s => s.id === activeSessionId);
        if (!cur) return;

        if (cur.messages.length === 0) {
          cur.title = text.slice(0, 24);
          renderSessions();
        }

        cur.messages.push({ role: 'user', content: text, author: 'USER' });
        appendMessage('user', text, 'USER');
        promptInput.value = '';

        const aiMsg = { role: 'assistant', content: '', author: activeModel };
        cur.messages.push(aiMsg);
        const aiBody = appendMessage('assistant', '...', activeModel);

        // Fetch streaming from 9Router
        const apiPayload = cur.messages
          .filter(m => m.role === 'user' || (m.role === 'assistant' && m.content && m.content !== '...'))
          .map(m => ({ role: m.role, content: m.content }));

        aiMsg.content = '';
        try {
          const res = await fetch(ROUTER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': ROUTER_KEY },
            body: JSON.stringify({ model: activeModel, messages: apiPayload, stream: true })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed === 'data: [DONE]') continue;
              if (trimmed.startsWith('data: ')) {
                try {
                  const json = JSON.parse(trimmed.slice(6));
                  const delta = json.choices?.[0]?.delta?.content;
                  if (delta) {
                    aiMsg.content += delta;
                    aiBody.innerHTML = formatMarkdown(aiMsg.content);
                    messagesScroll.scrollTop = messagesScroll.scrollHeight;

                    // AI DECISION: Trigger Side Canvas if code block or command is detected
                    checkAiAutoSplit(aiMsg.content);
                  }
                } catch (e) {}
              }
            }
          }
        } catch (err) {
          aiMsg.content = '[Error connecting to model: ' + err.message + ']';
          aiBody.innerHTML = formatMarkdown(aiMsg.content);
        }
      }

      // AI Decision: Open split canvas when generating code or executing tasks
      function checkAiAutoSplit(fullText) {
        const codeBlockMatch = fullText.match(/```([a-zA-Z0-9_-]*)\n([\s\S]+?)```/);
        if (codeBlockMatch) {
          const lang = codeBlockMatch[1] || 'code';
          const code = codeBlockMatch[2];
          aiOpenSideCanvas(`Artifact (${lang})`, `<pre class="code-block"><code>${escapeHtml(code)}</code></pre>`);
        }
      }

      btnSubmit.addEventListener('click', handleSend);
      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      // Sync Models from 9Router
      async function syncModels() {
        try {
          const res = await fetch('http://127.0.0.1:20128/v1/models', {
            headers: { 'Authorization': ROUTER_KEY }
          });
          if (res.ok) {
            const data = await res.json();
            const list = data.data?.map(m => m.id);
            if (list && list.length > 0) {
              allModels = list;
              document.getElementById('routerStatus').textContent = `• 9Router :20128 (${allModels.length} Models)`;
            }
          }
        } catch (e) {}
      }

      function formatMarkdown(text) {
        if (!text) return '';
        let s = escapeHtml(text);
        s = s.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, '<pre class="code-block"><code>$2</code></pre>');
        s = s.replace(/`([^`]+)`/g, '<code style="background: #2d2d2d; padding: 2px 4px; font-family: var(--font-mono);">$1</code>');
        s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\n/g, '<br/>');
        return s;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      renderSessions();
      renderChat();
      syncModels();
    })();
  </script>
</body>
</html>
