[package]
name = "omw-desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
omw-core = { path = "../../../crates/omw-core" }
omw-guardian = { path = "../../../crates/omw-guardian" }
omw-terminal = { path = "../../../crates/omw-terminal" }
omw-harness = { path = "../../../crates/omw-harness" }
omw-memory = { path = "../../../crates/omw-memory" }
omw-session = { path = "../../../crates/omw-session" }
